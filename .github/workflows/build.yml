name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Game tests (loads every registry, datapack and worldgen file)
        run: |
          set -o pipefail
          timeout 900 ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          echo "---- warnings / errors from the mod ----"
          grep -nE "dunesrelics" gametest.log | grep -E "WARN|ERROR|Exception|Failed|Couldn't|Missing" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dunesrelics
          path: build/libs/*.jar

      - name: Publish jar into dist/
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]')
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/dunesrelics-*.jar dist/
          rm -f dist/*-slim.jar
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then echo "jar unchanged"; exit 0; fi
          git commit -m "Build jar for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
