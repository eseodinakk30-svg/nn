name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Game tests (loads every registry, datapack and worldgen file)
        run: |
          set -o pipefail
          timeout 900 ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          echo "---- warnings / errors from the mod ----"
          grep -nE "dunesrelics" gametest.log | grep -E "WARN|ERROR|Exception|Failed|Couldn't|Missing" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dunesrelics
          path: build/libs/*.jar

      - name: Publish jar into dist/
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]')
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp build/libs/dunesrelics-*.jar dist/
          rm -f dist/*-slim.jar
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then echo "jar unchanged"; exit 0; fi
          git commit -m "Build jar for ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Volcano soak test (real world, flies to a volcano and records any crash)
        if: contains(github.event.head_commit.message, '[soak]')
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick xdotool libgl1-mesa-dri > /dev/null
          ./ci/soak.sh

      - name: Commit soak results
        if: contains(github.event.head_commit.message, '[soak]')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/soak
          git commit -m "CI volcano soak results for ${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Showcase (runs the game and takes screenshots)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[showcase]')
        continue-on-error: true
        timeout-minutes: 25
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick xdotool libgl1-mesa-dri > /dev/null
          ./ci/showcase.sh

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[showcase]')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/screenshots
          git commit -m "CI showcase screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
